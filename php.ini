; Display errors on screen (good for dev)
display_errors = On
display_startup_errors = On

; Report all errors except warnings and notices (suppress session_start warnings)
error_reporting = E_ALL & ~E_WARNING & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

; Log errors to a file inside the container
log_errors = On
error_log = /var/log/php_errors.log

; Session settings (default, like USBWebServer)
session.save_handler = files
session.save_path = "/tmp"
session.use_cookies = 1
session.use_only_cookies = 1
session.auto_start = 0

; Output buffering to help prevent headers already sent errors
output_buffering = On
